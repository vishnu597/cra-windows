name: Windows

# The Windows port: Packages/CraCore building and passing its tests off Apple platforms (on
# Windows and, as a cheap second check, Linux), and the Windows app in Windows/ building.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-windows:
    name: CraCore on Windows
    runs-on: windows-2022
    steps:
      - uses: compnerd/gha-setup-swift@v0.5.1
        with:
          swift-version: swift-6.1.2-release
          swift-build: 6.1.2-RELEASE

      - uses: actions/checkout@v4

      - name: Build and test CraCore
        run: swift test --package-path Packages/CraCore

  core-linux:
    name: CraCore on Linux
    runs-on: ubuntu-24.04
    container: swift:6.1.2-noble
    steps:
      - uses: actions/checkout@v4

      # The plugin archive fixtures create ZIPs, and the portable Unix extractor uses unzip.
      - name: Install ZIP utilities
        run: apt-get update && apt-get install -y --no-install-recommends zip unzip

      - name: Build and test CraCore
        run: swift test --package-path Packages/CraCore --enable-code-coverage

      # The macOS CI holds CraCore to 85 % of its lines (scripts/coverage.py, docs/testing.md).
      # The same bar here, so a change to CraCore from Windows work is held to it as well.
      - name: CraCore coverage
        shell: bash
        run: |
          set -euo pipefail
          json=$(swift test --package-path Packages/CraCore --show-codecov-path)
          bin="$(swift build --package-path Packages/CraCore --show-bin-path)/CraCorePackageTests.xctest"
          llvm-cov report "$bin" -instr-profile "$(dirname "$json")/default.profdata" \
            -ignore-filename-regex '/(Tests|\.build)/' | tee coverage.txt
          awk '$1 == "TOTAL" { lines = $8; missed = $9 }
               END { pct = 100 * (lines - missed) / lines
                     printf "CraCore: %.1f %% of %d lines (minimum 85 %%)\n", pct, lines
                     if (pct < 85) exit 1 }' coverage.txt | tee -a "$GITHUB_STEP_SUMMARY"

  app-windows:
    name: Build Cra for Windows
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: compnerd/gha-setup-swift@v0.5.1
        with:
          swift-version: swift-6.1.2-release
          swift-build: 6.1.2-RELEASE

      - uses: actions/checkout@v4

      - name: Cache CEF
        uses: actions/cache@v4
        with:
          path: Windows/vendor/cef
          key: cef-windows64-${{ hashFiles('scripts/fetch-cef.sh') }}

      # The WinUI projections take about 12 minutes to compile from scratch.
      # Restored and saved as separate steps so a failed build still saves what it compiled.
      # The projections' sources (vendor/winrt) are cached with the build: cloned afresh they
      # get new timestamps, and SwiftPM then compiles every projection again.
      - name: Restore Swift build
        uses: actions/cache/restore@v4
        with:
          path: |
            Windows/.build
            Windows/vendor/winrt
          key: swiftpm-windows-${{ hashFiles('Windows/Package.swift', 'Windows/scripts/fetch-deps.ps1') }}-${{ github.sha }}
          restore-keys: |
            swiftpm-windows-${{ hashFiles('Windows/Package.swift', 'Windows/scripts/fetch-deps.ps1') }}-
            swiftpm-windows-

      # Without the runtime, Cra.exe stops at the Windows App SDK's "install the runtime" prompt
      # and the start-up check never reaches Chromium.
      - name: Install the Windows App Runtime
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 10
        run: |
          curl.exe -L --no-progress-meter -o "$env:RUNNER_TEMP\war.exe" https://aka.ms/windowsappsdk/1.7/latest/windowsappruntimeinstall-x64.exe
          & "$env:RUNNER_TEMP\war.exe" --quiet
          Write-Host "installer exited with $LASTEXITCODE"

      - name: Fetch CEF and the Swift/WinRT projections
        shell: pwsh
        timeout-minutes: 20
        run: Windows/scripts/fetch-deps.ps1

      - name: Resolve Swift packages
        timeout-minutes: 10
        run: swift package --package-path Windows resolve

      # The WinUI projections are large generated modules; build them on their own first so a
      # slow or hung compile shows which module it is. The flags must be the ones build.ps1
      # passes: with any other (-v included, which reaches every swiftc command) the next step
      # compiles all four projections a second time.
      - name: Build the WinUI projections
        timeout-minutes: 30
        run: swift build --package-path Windows -c release --target WinUI -Xlinker /DEBUG

      - name: Build and assemble Cra
        shell: pwsh
        timeout-minutes: 30
        run: Windows/scripts/build.ps1

      - name: Save Swift build
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            Windows/.build
            Windows/vendor/winrt
          key: swiftpm-windows-${{ hashFiles('Windows/Package.swift', 'Windows/scripts/fetch-deps.ps1') }}-${{ github.sha }}

      # Uploaded even when the start-up check fails, so the build can be tried on a real PC.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cra-windows-x64
          path: Windows/build/Cra
          retention-days: 7
          if-no-files-found: ignore
